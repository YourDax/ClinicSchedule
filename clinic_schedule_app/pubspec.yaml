name: clinic_schedule_app
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.5.4


dependencies:
  flutter:
    sdk: flutter

  # Виджеты
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.16

  # Сетевое взаимодействие
  json_annotation: ^4.8.1
  dio: ^5.4.2+1
  pretty_dio_logger: ^1.3.1

  # BLoC
  equatable: ^2.0.5
  flutter_bloc: ^8.1.5
