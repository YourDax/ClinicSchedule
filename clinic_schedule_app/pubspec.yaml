dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Иконки
  flutter_launcher_icons: ^0.14.2
  # Сетевое взаимодействие
  build_runner: ^2.4.9
  json_serializable: ^6.7.1

flutter_icons:
  android: "ic_launcher"
  image_path: "assets/launcher.png"
  min_sdk_android: 21


flutter:
  generate: true
  uses-material-design: true
